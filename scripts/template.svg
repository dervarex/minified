<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="{height}" viewBox="0 0 1120 {height}" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect width="1120" height="{height}" fill="#0a0a0c"/>

    <text x="48" y="72" font-size="30" font-weight="500" fill="#e8e8ec" letter-spacing="-0.6" font-family="Charter, 'Iowan Old Style', Georgia, serif">Supported Versions</text>
    <text x="1072" y="72" font-size="12" fill="#5a5a62" text-anchor="end">
        <tspan fill="#7ab87a">●</tspan><tspan> pass</tspan>
        <tspan dx="16" fill="#c26565">●</tspan><tspan> fail</tspan>
        <tspan dx="16" fill="#3a3a42">○</tspan><tspan> not tested</tspan>
    </text>
    <text x="1072" y="100" font-size="11" fill="#3a3a42" text-anchor="end" font-family="Consolas, 'Courier New', monospace">generated {date}</text>
    <line x1="48" y1="128" x2="1072" y2="128" stroke="#1a1a1f" stroke-width="1"/>

    {content}

    <line x1="196" y1="152" x2="196" y2="{footer_top}" stroke="#14141a" stroke-width="1"/>
    <line x1="0" y1="{footer_top}" x2="1072" y2="{footer_top}" stroke="#1a1a1f" stroke-width="1"/>
    <text x="48" y="{footer_text}" font-size="11" fill="#3a3a42">{summary}</text>
    <text x="1072" y="{footer_text}" font-size="11" fill="#3a3a42" text-anchor="end" font-family="Consolas, 'Courier New', monospace">mc-version-support</text>
</svg>