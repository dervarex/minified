allprojects {
    group = 'com.dervarex.minified'
    version = '2.2.0'
}

def propOrEnv = { String propName, String envName ->
    if (project.hasProperty(propName)) {
        return project.property(propName)
    }
    return System.getenv(envName)
}

def pomValue = { String propName, String envName, String fallback ->
    return propOrEnv(propName, envName) ?: fallback
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = pomValue('POM_NAME', 'POM_NAME', project.name)
                    description = pomValue('POM_DESCRIPTION', 'POM_DESCRIPTION', project.description ?: project.name)
                    url = pomValue('POM_URL', 'POM_URL', '')
                    licenses {
                        license {
                            name = pomValue('POM_LICENSE_NAME', 'POM_LICENSE_NAME', '')
                            url = pomValue('POM_LICENSE_URL', 'POM_LICENSE_URL', '')
                        }
                    }
                    developers {
                        developer {
                            id = pomValue('POM_DEVELOPER_ID', 'POM_DEVELOPER_ID', '')
                            name = pomValue('POM_DEVELOPER_NAME', 'POM_DEVELOPER_NAME', '')
                            email = pomValue('POM_DEVELOPER_EMAIL', 'POM_DEVELOPER_EMAIL', '')
                        }
                    }
                    scm {
                        connection = pomValue('POM_SCM_CONNECTION', 'POM_SCM_CONNECTION', '')
                        developerConnection = pomValue('POM_SCM_DEV_CONNECTION', 'POM_SCM_DEV_CONNECTION', '')
                        url = pomValue('POM_SCM_URL', 'POM_SCM_URL', '')
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'OSSRH'
                def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = propOrEnv('ossrhUsername', 'OSSRH_USERNAME')
                    password = propOrEnv('ossrhPassword', 'OSSRH_PASSWORD')
                }
            }
        }
    }

    signing {
        def signingKey = propOrEnv('signingKey', 'SIGNING_KEY')
        def signingPassword = propOrEnv('signingPassword', 'SIGNING_PASSWORD')
        required { !version.toString().endsWith('SNAPSHOT') && signingKey }
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications
        }
    }
}
