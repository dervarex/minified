plugins {
    id 'org.gradlex.extra-java-module-info' version '1.8' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

allprojects {
    group = 'io.github.dervarex.minified'
    version = '3.3.0'
}

configure(subprojects.findAll { it.name != 'docs' }) {
    apply plugin: 'java-library'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'org.gradlex.extra-java-module-info'
    apply plugin: 'jacoco'

    repositories {
        mavenCentral()
    }

    extraJavaModuleInfo {
        failOnMissingModuleInfo = false
        automaticModule('net.raphimc:MinecraftAuth', 'MinecraftAuth')
        automaticModule('net.lenni0451.commons:httpclient', 'httpclient')
        automaticModule('net.lenni0451.commons:gson', 'net.lenni0451.commons.gson')
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        modularity.inferModulePath = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
    jacoco {
        toolVersion = '0.8.12'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.named('test') {
        finalizedBy tasks.named('jacocoTestReport')
    }

    // released by .github/workflows/release.yml
    mavenPublishing {
        publishToMavenCentral()
        if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
            signAllPublications()
        }

        pom {
            name = project.name
            description = provider { project.description ?: project.name }
            url = 'https://github.com/dervarex/minified'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'dervarex'
                    name = 'dervarex'
                    url = 'https://github.com/dervarex'
                }
            }
            scm {
                url = 'https://github.com/dervarex/minified'
                connection = 'scm:git:https://github.com/dervarex/minified.git'
                developerConnection = 'scm:git:ssh://git@github.com/dervarex/minified.git'
            }
        }
    }
}