name: Feature request
description: Something minified should be able to do, but can't (yet)
labels: ["enhancement", "needs triage"]
projects: ["dervarex/3"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Nice. Bigger features should be discussed here first, before anyone writes code.

  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or use case, not only the solution. "I want to show download progress per file" helps more than "add a method X"
      placeholder: My launcher should show which mod is currently being downloaded
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea for the API, if you have one. Code welcome, doesn't have to compile, just for reference
      render: java

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds / alternatives
      description: How do you deal with it right now? Anything else you considered?

  - type: dropdown
    id: modules
    attributes:
      label: Affected module(s)
      description: Where would it go? If you don't know, pick "No idea"
      multiple: true
      options:
        - minified-launch
        - minified-auth
        - minified-java
        - minified-modrinth
        - minified-worlds
        - minified-events
        - minified-utils
        - New module
        - No idea
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Help
      options:
        - label: I'd like to implement this myself
