name: Version Support Matrix

on:
  workflow_dispatch:
    inputs:
      loaders:
        description: 'Comma separated loaders (empty = all)'
        default: ''
      mc_versions:
        description: 'Comma separated MC versions (empty = all)'
        default: ''
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: version-matrix
  cancel-in-progress: false

jobs:
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        env:
          INPUT_LOADERS: ${{ github.event.inputs.loaders }}
          INPUT_MC_VERSIONS: ${{ github.event.inputs.mc_versions }}
        run: |
          MATRIX=$(python3 scripts/version-matrix/matrix.py jobs --loaders "$INPUT_LOADERS" --versions "$INPUT_MC_VERSIONS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  matrix:
    name: ${{ matrix.loader }} ${{ matrix.mc_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache MC artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
          key: mc-${{ matrix.loader }}-${{ matrix.mc_version }}-${{ hashFiles('**/*.gradle*') }}

      # LWJGL 2 (Minecraft 1.12.2 and older) runs the xrandr command to list the display modes and crashes without it.
      # 26.3+ need Mesa's EGL, see SDL_VIDEO_FORCE_EGL below
      - name: Install Xvfb, xrandr and EGL
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Run headless launch
        env:
          MINIFIED_TEST_LOADER: ${{ matrix.loader }}
          MINIFIED_TEST_MC_VERSION: ${{ matrix.mc_version }}
          MINIFIED_TEST_HEADLESS: "true"
          MINIFIED_TEST_TIMEOUT_SECONDS: "180"
          # 26.3+ create their window with SDL, which asks for an sRGB GLX visual. Ubuntu's Xvfb has none,
          # Mesa's EGL does, so we use that one
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
          ./gradlew :minified-launch:test \
            --no-daemon \
            --tests 'com.dervarex.minified.launch.VersionSupportTest' \
            -Dgroups=version-matrix \
            -Dmatrix.loader="$MINIFIED_TEST_LOADER" \
            -Dmatrix.mcVersion="$MINIFIED_TEST_MC_VERSION" \
            -Dmatrix.headless="$MINIFIED_TEST_HEADLESS" \
            -Dmatrix.timeoutSeconds="$MINIFIED_TEST_TIMEOUT_SECONDS" \
            -Dmatrix.resultFile="$PWD/matrix-results/${{ matrix.loader }}-${{ matrix.mc_version }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-result-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: matrix-results/
          if-no-files-found: warn

      - name: Clean matrix-results
        if: always()
        run: rm -rf matrix-results

  aggregate:
    name: Aggregate SUPPORTED_VERSIONS.svg
    needs: matrix
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download all matrix results
        uses: actions/download-artifact@v4
        with:
          path: matrix-results
          pattern: matrix-result-*
          merge-multiple: true

      # results.json keeps the results of earlier runs, so runs of only some loaders/versions don't lose the others
      - name: Update results and SUPPORTED_VERSIONS.svg
        run: |
          python3 scripts/version-matrix/matrix.py merge matrix-results
          python3 scripts/version-matrix/matrix.py render -o SUPPORTED_VERSIONS.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED_VERSIONS.svg scripts/version-matrix/results.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update SUPPORTED_VERSIONS.svg"
          git push

      - name: Clean matrix-results
        if: always()
        run: rm -rf matrix-results