name: Version Support Matrix

on:
  workflow_dispatch:
    inputs:
      loaders:
        description: 'Comma separated loaders (empty = all)'
        default: ''
      mc_versions:
        description: 'Comma separated MC versions (empty = all)'
        default: ''
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: version-matrix
  cancel-in-progress: false

jobs:
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          INPUT_LOADERS: ${{ github.event.inputs.loaders }}
          INPUT_MC_VERSIONS: ${{ github.event.inputs.mc_versions }}
        run: |
          set -euo pipefail
          INPUT_LOADERS="${INPUT_LOADERS// /}"
          INPUT_MC_VERSIONS="${INPUT_MC_VERSIONS// /}"

          # only versions each loader exists for, oldest first
          MODDED="1.14.4,1.15.2,1.16.5,1.17.1,1.18.2,1.19.2,1.19.4,1.20.1,1.20.4,1.20.6,1.21.1,1.21.4,1.21.8,1.21.11,26.1,26.1.2,26.2,26.3"
          PAIRS="
          vanilla=rd-132211,c0.30_01c,inf-20100618,a1.2.6,b1.7.3,1.0,1.2.5,1.4.7,1.5.2,1.6.4,1.7.10,1.8.9,1.9.4,1.10.2,1.11.2,1.12.2,1.13.2,$MODDED
          fabric=$MODDED
          quilt=$MODDED
          forge=1.2.5,1.3.2,1.4.7,1.5.2,1.6.4,1.7.10,1.8.9,1.9.4,1.10.2,1.11.2,1.12.2,1.13.2,$MODDED
          neoforge=1.20.1,1.20.4,1.20.6,1.21.1,1.21.4,1.21.8,1.21.11,26.1,26.1.2,26.2,26.3
          "

          ENTRIES=""
          for line in $PAIRS; do
            L="${line%%=*}"
            if [ -n "$INPUT_LOADERS" ] && ! echo ",$INPUT_LOADERS," | grep -q ",$L,"; then
              continue
            fi
            IFS=',' read -ra VERSIONS <<< "${line#*=}"
            for M in "${VERSIONS[@]}"; do
              if [ -n "$INPUT_MC_VERSIONS" ] && ! echo ",$INPUT_MC_VERSIONS," | grep -q ",$M,"; then
                continue
              fi
              ENTRY="{\"loader\":\"$L\",\"mc_version\":\"$M\"}"
              if [ -z "$ENTRIES" ]; then ENTRIES="$ENTRY"; else ENTRIES="$ENTRIES,$ENTRY"; fi
            done
          done

          MATRIX="{\"include\":[$ENTRIES]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  matrix:
    name: ${{ matrix.loader }} ${{ matrix.mc_version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache MC artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
          key: mc-${{ matrix.loader }}-${{ matrix.mc_version }}-${{ hashFiles('**/*.gradle*') }}

      # LWJGL 2 (Minecraft 1.12.2 and older) runs the xrandr command to list the display modes and crashes without it
      - name: Install Xvfb and xrandr
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils

      - name: Run headless launch
        env:
          MINIFIED_TEST_LOADER: ${{ matrix.loader }}
          MINIFIED_TEST_MC_VERSION: ${{ matrix.mc_version }}
          MINIFIED_TEST_HEADLESS: "true"
          MINIFIED_TEST_TIMEOUT_SECONDS: "180"
          # 26.3+ create their window with SDL, which asks for an sRGB GLX visual. Ubuntu's Xvfb has none,
          # Mesa's EGL does, so we use that one
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
          ./gradlew :minified-launch:test \
            --no-daemon \
            --tests 'com.dervarex.minified.launch.VersionSupportTest' \
            -Dgroups=version-matrix \
            -Dmatrix.loader="$MINIFIED_TEST_LOADER" \
            -Dmatrix.mcVersion="$MINIFIED_TEST_MC_VERSION" \
            -Dmatrix.headless="$MINIFIED_TEST_HEADLESS" \
            -Dmatrix.timeoutSeconds="$MINIFIED_TEST_TIMEOUT_SECONDS" \
            -Dmatrix.resultFile="$PWD/matrix-results/${{ matrix.loader }}-${{ matrix.mc_version }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-result-${{ matrix.loader }}-${{ matrix.mc_version }}
          path: matrix-results/
          if-no-files-found: warn

      - name: Clean matrix-results
        if: always()
        run: rm -rf matrix-results

  aggregate:
    name: Aggregate SUPPORTED_VERSIONS.svg
    needs: matrix
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download all matrix results
        uses: actions/download-artifact@v4
        with:
          path: matrix-results
          pattern: matrix-result-*
          merge-multiple: true

      - name: Generate SUPPORTED_VERSIONS.svg
        run: node scripts/generate-supported-versions.mjs matrix-results SUPPORTED_VERSIONS.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED_VERSIONS.svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update SUPPORTED_VERSIONS.svg"
          git push

      - name: Clean matrix-results
        if: always()
        run: rm -rf matrix-results