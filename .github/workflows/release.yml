name: Release

# Publishes all lib modules to Maven Central when a version tag is pushed

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Maven Central releases cannot be changed or deleted, so we better be sure here
      - name: Check tag matches build.gradle version
        run: |
          VERSION="$(./gradlew -q properties --property version --no-daemon | sed -n 's/^version: //p')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in build.gradle"
            exit 1
          fi

      - name: Run tests (exclude manual)
        run: ./gradlew test --no-daemon

      - name: Publish and release
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # Makes the GitHub release draft once Maven Central has it. Intro will be manually written, same goes for Releasing it
  draft-release:
    name: Draft GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create draft with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, we'll leave that alone, exiting"
            exit 0
          fi
          PREVIOUS="$({ git tag --list 'v*'; echo "$TAG"; } | sort -uV | grep -Fx -B1 "$TAG" | head -n1)"
          [ "$PREVIOUS" = "$TAG" ] && PREVIOUS=""
          ARGS=(-f tag_name="$TAG")
          [ -n "$PREVIOUS" ] && ARGS+=(-f previous_tag_name="$PREVIOUS")
          NOTES="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" -q .body)"

          {
            echo "# Minified $TAG"
            echo
            echo "<!-- intro stuff here -->"
            echo
            echo "$NOTES"
            echo
            echo "## Installation"
            echo '```gradle'
            echo 'repositories {'
            echo '    mavenCentral()'
            echo '}'
            echo 'dependencies {'
            echo "    implementation 'io.github.dervarex.minified:minified-launch:${TAG#v}'"
            echo '}'
            echo '```'
          } > notes.md

          gh release create "$TAG" --draft --verify-tag --title "Minified $TAG" --notes-file notes.md
