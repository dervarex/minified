name: Commit docs

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit hash
        required: true

permissions: {}

env:
  # oldest commit builds are removed when we have more
  KEEP: 25

jobs:
  build:
    name: Build documentation
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'docs build')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      dir: ${{ steps.resolve.outputs.dir }}
      exists: ${{ steps.resolve.outputs.exists }}
      error: ${{ steps.resolve.outputs.error }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: resolve
        env:
          INPUT: ${{ github.event.inputs.commit }}
          BODY: ${{ github.event.issue.body }}
        run: |
          fail() {
            echo "error=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 0
          }
          RAW="$INPUT"
          if [ -z "$RAW" ]; then
            # issue forms render the field as "### Commit" followed by the answer
            RAW="$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n '/^### Commit/,$p' | sed 1d | grep -m 1 -v '^[[:space:]]*$' || true)"
          fi
          RAW="${RAW##*/commit/}"
          RAW="$(printf '%s' "$RAW" | grep -oE '^[[:space:]]*[0-9a-fA-F]+' | tr -d '[:space:]' || true)"
          if ! [[ "$RAW" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            fail "That doesn't look like a commit hash, it needs at least 7 characters."
          fi
          if ! SHA="$(git rev-parse --verify --quiet "${RAW}^{commit}")"; then
            fail "Commit \`$RAW\` doesn't exist in this repository (or the short hash is ambiguous)."
          fi
          if [ -z "$(git for-each-ref --count=1 --contains "$SHA" refs/remotes/origin refs/tags)" ]; then
            fail "Commit \`${SHA::7}\` isn't on any branch or tag of this repository."
          fi
          DIR="commit-${SHA::12}"
          EXISTS=false
          if [ -n "$(git ls-tree -d origin/gh-pages "$DIR" 2>/dev/null)" ]; then
            EXISTS=true
          fi
          {
            echo "sha=$SHA"
            echo "dir=$DIR"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"

      - name: Check out commit
        if: steps.resolve.outputs.error == '' && steps.resolve.outputs.exists == 'false'
        run: git checkout --detach "${{ steps.resolve.outputs.sha }}"

      - name: Set up JDK 21
        if: steps.resolve.outputs.error == '' && steps.resolve.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate site
        if: steps.resolve.outputs.error == '' && steps.resolve.outputs.exists == 'false'
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          DIR: ${{ steps.resolve.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew :docs:docs -PdocsCommit="$SHA" --no-daemon
          jq -n --arg sha "$SHA" --arg dir "$DIR" --arg version "$(cat docs/build/site/VERSION)" \
            --arg date "$(git show -s --format=%cI "$SHA")" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, dir: $dir, version: $version, date: $date, built: $built}' > docs/build/site/commit.json

      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.error == '' && steps.resolve.outputs.exists == 'false'
        with:
          name: site
          path: docs/build/site
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    if: needs.build.outputs.error == '' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Push gh-pages
        working-directory: pages
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DIR: ${{ needs.build.outputs.dir }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gh-pages
            git reset --hard FETCH_HEAD
            rm -rf "$DIR"
            cp -r ../site "$DIR"

            BUILDS="$(cat commit-*/commit.json | jq -s 'sort_by(.built) | reverse')"
            for old in $(echo "$BUILDS" | jq -r --argjson keep "$KEEP" '.[$keep:][].dir'); do
              rm -rf "$old"
            done
            echo "$BUILDS" | jq --argjson keep "$KEEP" '{commits: (.[:$keep] | sort_by(.date) | reverse)}' > commits.json

            git add -A
            # a parallel request for the same commit can have published it already
            git diff --cached --quiet || git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Docs for commit ${SHA::7}"
            if git push origin HEAD:gh-pages; then
              echo "Published to \`/$DIR/\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

  reply:
    name: Answer the request
    needs: [build, publish]
    if: always() && github.event_name == 'issues' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          SHA: ${{ needs.build.outputs.sha }}
          DIR: ${{ needs.build.outputs.dir }}
          EXISTS: ${{ needs.build.outputs.exists }}
          ERROR: ${{ needs.build.outputs.error }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const { SHA, DIR, EXISTS, ERROR, BUILD, PUBLISH } = process.env;
            const issue_number = context.payload.issue.number;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/${DIR}/`;

            let body, state_reason;
            if (ERROR) {
              body = `${ERROR}\n\nOpen a new request with a commit from this repository.`;
              state_reason = 'not_planned';
            } else if (EXISTS === 'true') {
              body = `The documentation for \`${SHA.slice(0, 7)}\` is already built: ${url}`;
              state_reason = 'completed';
            } else if (BUILD === 'success' && PUBLISH === 'success') {
              body = `Done, the documentation for \`${SHA.slice(0, 7)}\` is at ${url}\n\nGitHub Pages can take a minute or two to deploy it.`;
              state_reason = 'completed';
            } else {
              // left open so a maintainer sees it
              body = `Building the documentation for \`${(SHA || '').slice(0, 7)}\` failed, see ${run}\n\n`
                + 'Commits from before the documentation generator was added can\'t be built.';
            }

            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            if (state_reason) {
              await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed', state_reason });
            }
