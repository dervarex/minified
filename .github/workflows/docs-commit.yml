name: Commit docs

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit hash
        required: true

permissions: {}

env:
  # oldest commit builds are removed when we have more
  KEEP: 25

jobs:
  resolve:
    name: Resolve commit
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'docs build')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      dir: ${{ steps.resolve.outputs.dir }}
      exists: ${{ steps.resolve.outputs.exists }}
      error: ${{ steps.resolve.outputs.error }}
      input: ${{ steps.resolve.outputs.input }}
      first: ${{ steps.resolve.outputs.first }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: resolve
        env:
          INPUT: ${{ github.event.inputs.commit }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # error codes match the messages in the reply job
          fail() {
            echo "error=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 0
          }
          RAW="$INPUT"
          if [ -z "$RAW" ]; then
            # issue forms render the field as "### Commit" followed by the answer
            RAW="$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n '/^### Commit/,$p' | sed 1d | grep -m 1 -v '^[[:space:]]*$' || true)"
          fi
          RAW="${RAW##*/commit/}"
          RAW="$(printf '%s' "$RAW" | grep -oE '^[[:space:]]*[0-9a-fA-F]+' | tr -d '[:space:]' || true)"
          echo "input=$RAW" >> "$GITHUB_OUTPUT"
          if ! [[ "$RAW" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            fail invalid
          fi
          if ! SHA="$(git rev-parse --verify --quiet "${RAW}^{commit}")"; then
            fail unknown
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$(git for-each-ref --count=1 --contains "$SHA" refs/remotes/origin refs/tags)" ]; then
            fail foreign
          fi

          for TAG in $(git tag --points-at "$SHA" 'v[0-9]*' | sort -rV); do
            if [ -n "$(git ls-tree -d origin/gh-pages "${TAG#v}" 2>/dev/null)" ]; then
              {
                echo "release=${TAG#v}"
                echo "dir=${TAG#v}"
                echo "exists=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if ! git cat-file -e "$SHA:docs/build.gradle" 2>/dev/null; then
            echo "first=$(git log --diff-filter=A --format=%h -- docs/build.gradle | tail -n 1)" >> "$GITHUB_OUTPUT"
            fail too-old
          fi
          DIR="commit-${SHA::12}"
          EXISTS=false
          if [ -n "$(git ls-tree -d origin/gh-pages "$DIR" 2>/dev/null)" ]; then
            EXISTS=true
          fi
          {
            echo "dir=$DIR"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"

  greet:
    name: Answer the request
    needs: resolve
    if: github.event_name == 'issues' && needs.resolve.outputs.error == '' && needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const commit = process.env.SHA.slice(0, 7);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: `Hey there!\nI'm building the documentation for \`${commit}\` now, shouldn't take long`,
            });

  build:
    name: Build documentation
    needs: resolve
    if: needs.resolve.outputs.error == '' && needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-latest
    # runs the commit's own build, so no write access here
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate site
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          DIR: ${{ needs.resolve.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew :docs:docs -PdocsCommit="$SHA" --no-daemon
          jq -n --arg sha "$SHA" --arg dir "$DIR" --arg version "$(cat docs/build/site/VERSION)" \
            --arg date "$(git show -s --format=%cI "$SHA")" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, dir: $dir, version: $version, date: $date, built: $built}' > docs/build/site/commit.json

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/build/site
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish documentation
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Push gh-pages
        working-directory: pages
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          DIR: ${{ needs.resolve.outputs.dir }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin gh-pages
            git reset --hard FETCH_HEAD
            rm -rf "$DIR"
            cp -r ../site "$DIR"

            BUILDS="$(cat commit-*/commit.json | jq -s 'sort_by(.built) | reverse')"
            for old in $(echo "$BUILDS" | jq -r --argjson keep "$KEEP" '.[$keep:][].dir'); do
              rm -rf "$old"
            done
            echo "$BUILDS" | jq --argjson keep "$KEEP" '{commits: (.[:$keep] | sort_by(.date) | reverse)}' > commits.json

            git add -A
            # a parallel request for the same commit can have published it already
            git diff --cached --quiet || git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Docs for commit ${SHA::7}"
            if git push origin HEAD:gh-pages; then
              echo "Published to \`/$DIR/\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

  reply:
    name: Send the result
    needs: [resolve, build, publish]
    if: always() && github.event_name == 'issues' && needs.resolve.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          DIR: ${{ needs.resolve.outputs.dir }}
          EXISTS: ${{ needs.resolve.outputs.exists }}
          ERROR: ${{ needs.resolve.outputs.error }}
          INPUT: ${{ needs.resolve.outputs.input }}
          FIRST: ${{ needs.resolve.outputs.first }}
          RELEASE: ${{ needs.resolve.outputs.release }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const { SHA, DIR, EXISTS, ERROR, INPUT, FIRST, RELEASE, BUILD, PUBLISH } = process.env;
            const issue_number = context.payload.issue.number;
            const commit = (SHA || '').slice(0, 7);
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/${DIR}/`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const messages = {
              built: `Done, the documentation for \`${commit}\` built!\n\nI'll reply with the url once it's deployed, usually takes 1-2 minutes.`,
              deployed: `It's deployed, here you go: ${url}`,
              slow: `Deploying takes longer than usual, it should show up at ${url} soon`,
              exists: `The documentation for \`${commit}\` is already built: ${url}`,
              release: `\`${commit}\` is v${RELEASE}, its documentation is at ${url}`,
              invalid: 'That doesn\'t look like a commit hash to me, it needs at least 7 characters.',
              unknown: `Commit \`${INPUT}\` doesn't exist in this repository.`,
              foreign: `Commit \`${commit}\` isn't on any branch or tag of this repository.`,
              'too-old': `Commit \`${commit}\` is older than the documentation generator, sorry :(\nthe first commit that can be built is \`${FIRST}\`.`,
              failed: `Building the documentation for \`${commit}\` failed, see ${run}`,
            };
            const reply = (name) => github.rest.issues.createComment({ ...context.repo, issue_number, body: messages[name] });
            const close = (state_reason) => github.rest.issues.update({ ...context.repo, issue_number, state: 'closed', state_reason });

            if (ERROR) {
              await reply(ERROR);
              await close('not_planned');
            } else if (RELEASE || EXISTS === 'true') {
              await reply(RELEASE ? 'release' : 'exists');
              await close('completed');
            } else if (BUILD === 'success' && PUBLISH === 'success') {
              await reply('built');
              // GitHub Pages deploys gh-pages on its own, we wait until the page is there (10 minutes at most)
              const deployed = () => fetch(`${url}?${Date.now()}`, { method: 'HEAD' }).then((r) => r.ok, () => false);
              let ok = false;
              for (let i = 0; i < 60 && !(ok = await deployed()); i++) {
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
              await reply(ok ? 'deployed' : 'slow');
              await close('completed');
            } else {
              // left open so a maintainer sees it
              await reply('failed');
            }
