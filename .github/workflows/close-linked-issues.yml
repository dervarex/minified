name: Close linked issues

# GitHub closes "Closes #12" issues itself, but it only does that for prs into the main branch and doesn't leave a comment, so we do that here
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const keyword = String.raw`\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*`;
            const refs = new Set();
            for (const m of body.matchAll(new RegExp(keyword + String.raw`#(\d+)\b`, 'gi'))) refs.add(Number(m[1]));
            for (const m of body.matchAll(new RegExp(keyword + String.raw`https://github\.com/${owner}/${repo}/issues/(\d+)\b`, 'gi'))) {
              refs.add(Number(m[1]));
            }
            if (refs.size === 0) {
              core.info('No closing keywords, nothing to close.');
              return;
            }

            for (const number of refs) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (e) {
                core.warning(`#${number}: could not fetch (${e.status ?? e.message}), skipping.`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`#${number} is a pull request, skipping.`);
                continue;
              }
              const closedByThisMerge = issue.state === 'closed'
                && new Date(issue.closed_at) >= new Date(new Date(pr.merged_at).getTime() - 10_000);
              if (issue.state === 'closed' && !closedByThisMerge) {
                core.info(`#${number} is already closed, skipping.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: [
                  `Closed by #${pr.number} (${pr.html_url}), which was merged into \`${pr.base.ref}\` and closes this issue.`,
                  '',
                  'The change ships with the next release. If this isn\'t actually resolved, please reopen the issue and tell us the Reason.',
                ].join('\n'),
              });
              if (closedByThisMerge) {
                core.info(`#${number} was closed by GitHub`);
                continue;
              }
              await github.rest.issues.update({
                owner, repo, issue_number: number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed #${number}.`);
            }
