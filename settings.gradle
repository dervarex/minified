pluginManagement {
    repositories {
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        maven { url = 'https://repo.opencollab.dev/main/' }
    }
}

rootProject.name = 'minified'

include 'minified-auth'
include 'minified-launch'
include 'minified-java'
include 'minified-utils'
include 'minified-modrinth'
include 'minified-events'
include 'minified-worlds'
include 'docs'
