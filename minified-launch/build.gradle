plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.dervarex.minified.launch'

description = 'Launch/runtime utilities'

repositories {
    mavenCentral()
    mavenLocal()

    maven {
        url = 'https://repo.opencollab.dev/main/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
dependencies {
    implementation project(":minified-java")
    implementation project(":minified-auth")
    implementation project(":minified-utils")
    implementation project(":minified-events")
    implementation 'org.apiguardian:apiguardian-api:1.1.2'
    implementation 'org.jsoup:jsoup:1.21.1'
    implementation 'org.projectlombok:lombok:1.18.42'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'

    implementation 'com.google.code.gson:gson:2.14.0'
}

test {
    useJUnitPlatform {
        def include = System.getProperty('groups')
        def exclude = System.getProperty('excludeGroups')
        if (include) {
            includeTags(*include.split(','))
        } else {
            excludeTags('manual')
        }
        if (exclude) {
            excludeTags(*exclude.split(','))
        }
    }

    [
            'matrix.loader',
            'matrix.loaderVersion',
            'matrix.mcVersion',
            'matrix.headless',
            'matrix.timeoutSeconds',
            'matrix.marker',
            'matrix.resultFile'
    ].each { key ->
        def value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }

    failOnNoDiscoveredTests = false

    if (System.getProperty('matrix.loader') != null) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.register("manualTest", Test) {
    useJUnitPlatform {
        includeTags("manual")
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}